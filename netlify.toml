[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The API paths the apps call. Netlify serves functions from /.netlify/functions
# by default; these redirects give the stable /api/* surface the spec names.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
